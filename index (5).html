<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンタルスクリーニング | アスユメ Labo.</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
<!-- EmailJS: メール送信 -->

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:linear-gradient(135deg,#0F172A,#1E293B);min-height:100vh;padding:24px 16px;display:flex;justify-content:center;align-items:flex-start}
.card{background:white;border-radius:20px;padding:32px 28px;max-width:600px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.35)}
.logo-hero{background:#0A0A0A;border-radius:14px;padding:20px 24px;margin-bottom:16px;display:flex;justify-content:center;align-items:center}
.logo-hero img{height:160px;object-fit:contain;width:100%;max-width:480px}
.logo-bar{background:#0A0A0A;border-radius:10px;padding:10px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.logo-bar img{height:220px;object-fit:contain;width:100%;max-width:100%}
.logo-bar span{font-size:12px;color:#94A3B8}
h1{font-size:24px;font-weight:900;color:#0F172A;text-align:center;line-height:1.4;margin-bottom:8px}
.subtitle{text-align:center;font-size:13px;color:#64748B;margin-bottom:24px;line-height:1.8}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.info-item{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:#475569;font-weight:600}
.divider{text-align:center;font-size:11px;color:#94A3B8;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:16px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:38%;height:1px;background:#E2E8F0}
.divider::before{left:0}.divider::after{right:0}
label{display:block;font-size:12px;color:#64748B;font-weight:700;margin-bottom:6px}
input[type=text],input[type=email]{width:100%;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;margin-bottom:14px}
input:focus{border-color:#3B82F6}
.hint{font-size:11px;color:#94A3B8;margin-top:-10px;margin-bottom:14px}
.req{background:#DBEAFE;color:#2563EB;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:7px 16px;border:1.5px solid #E2E8F0;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;background:white;color:#475569;font-family:inherit;transition:all .15s}
.chip.active{background:#1E293B;color:white;border-color:#1E293B}
.btn-start{width:100%;padding:14px;background:linear-gradient(135deg,#3B82F6,#6366F1);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;letter-spacing:.03em}
.disclaimer{font-size:11px;color:#94A3B8;text-align:center;margin-top:14px;line-height:1.7}
.section-head{border-left:4px solid;padding-left:14px;margin-bottom:16px}
.section-badge{color:white;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-block;margin-bottom:6px}
.section-title{font-size:18px;font-weight:800;color:#0F172A}
.legend{font-size:12px;color:#64748B;background:#F8FAFC;padding:8px 14px;border-radius:8px;margin-bottom:14px;border:1px solid #E2E8F0}
.opt-header{display:flex;align-items:center;border-bottom:1px solid #F1F5F9;padding-bottom:8px;margin-bottom:6px}
.opt-header-sp{flex:1}
.opt-header-lbl{width:64px;text-align:center;font-size:10px;color:#94A3B8;font-weight:700}
.q-row{display:flex;flex-direction:column;padding:10px 8px;border-radius:10px;margin-bottom:8px;gap:6px;transition:background .2s;border:1px solid #F1F5F9}
.q-row.answered{background:#F8FAFC;border-color:#E2E8F0}
.q-num{min-width:20px;height:20px;background:#EFF6FF;color:#3B82F6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.q-text{font-size:13px;color:#334155;line-height:1.6;display:flex;align-items:flex-start;gap:8px}
.opt-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.opt-btn{width:100%;height:44px;border:2px solid #E2E8F0;border-radius:8px;cursor:pointer;background:white;font-size:12px;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;color:white}
.opt-btn.selected{transform:scale(1.04)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid #F1F5F9}
.btn-back{padding:10px 20px;background:white;border:1.5px solid #E2E8F0;border-radius:10px;font-size:13px;color:#64748B;cursor:pointer;font-weight:600;font-family:inherit}
.btn-next{padding:10px 24px;color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-next:disabled{background:#D1D5DB!important;cursor:not-allowed}
.dots{display:flex;gap:6px;align-items:center}
.dot{height:8px;border-radius:99px;transition:all .3s;background:#E5E7EB}
.warn{text-align:center;font-size:11px;color:#F59E0B;margin-top:8px}
.progress-bar{height:4px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:linear-gradient(90deg,#3B82F6,#8B5CF6);border-radius:99px;transition:width .5s}
.score-banner{border-radius:14px;border:1.5px solid;padding:20px 22px;display:flex;gap:20px;align-items:flex-start;margin-bottom:16px}
.score-val{font-size:52px;font-weight:900;line-height:1}
.risk-badge{color:white;font-weight:700;font-size:13px;padding:4px 14px;border-radius:99px;display:inline-block;margin-bottom:8px}
.gauge-wrap{margin-bottom:20px}
.gauge-track{height:8px;background:linear-gradient(90deg,#10B981 0%,#F59E0B 40%,#F97316 65%,#EF4444 100%);border-radius:99px;position:relative;margin-bottom:6px}
.gauge-thumb{position:absolute;width:18px;height:18px;border-radius:50%;top:50%;transform:translate(-50%,-50%);border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gauge-labels{display:flex;justify-content:space-between;font-size:10px;color:#94A3B8}
.bar-item{margin-bottom:10px}
.bar-label-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px}
.bar-track{height:6px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width 1s}
.detail-row{border-left:3px solid;padding-left:14px;margin-bottom:12px}
.detail-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.detail-tag{font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px}
.detail-comment{font-size:12px;color:#475569;line-height:1.8}
.meta-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.meta-tag{font-size:12px;font-weight:700;background:#F1F5F9;color:#475569;padding:3px 12px;border-radius:99px;border:1px solid #E2E8F0}

/* ── メール送信パネル ── */
.email-panel{background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:14px;padding:18px;margin-bottom:16px}
.email-panel h3{font-size:14px;font-weight:700;color:#1E40AF;margin-bottom:4px}
.email-panel p{font-size:12px;color:#3B82F6;margin-bottom:12px}
.btn-send{width:100%;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;color:white;background:linear-gradient(135deg,#3B82F6,#6366F1)}
.btn-send:disabled{background:#94A3B8;cursor:not-allowed}
.btn-send.success{background:#10B981}
.btn-send.error{background:#EF4444}
.status-msg{font-size:12px;margin-top:8px;text-align:center;font-weight:600}
.no-email-warn{background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:8px 12px;font-size:12px;color:#D97706;margin-bottom:10px}

/* ── 設定ガイドパネル ── */
.setup-panel{background:#F8FAFC;border:1.5px dashed #CBD5E1;border-radius:14px;padding:18px;margin-bottom:16px}
.setup-panel h3{font-size:13px;font-weight:700;color:#475569;margin-bottom:8px}
.setup-step{font-size:12px;color:#64748B;line-height:2;padding-left:4px}
.setup-step a{color:#3B82F6;text-decoration:underline}

.btn-row{display:flex;gap:12px;margin-bottom:16px}
.btn-print{flex:1;padding:12px;background:linear-gradient(135deg,#1E293B,#334155);color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-retry{flex:1;padding:12px;background:white;color:#475569;border:1.5px solid #E2E8F0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
@media print{.no-print{display:none!important}body{background:white!important;padding:0}.card{box-shadow:none;border-radius:0;max-width:100%}#__printarea__{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif}}
.policy-box{max-height:220px;overflow-y:auto;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:14px 16px;font-size:11px;color:#475569;line-height:1.8;margin-bottom:14px}
.policy-h{font-weight:700;color:#1E293B;margin:10px 0 4px;font-size:12px}
.agree-wrap{display:flex;align-items:flex-start;gap:10px;background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:10px;padding:12px 14px;cursor:pointer;margin-bottom:16px;transition:all .2s}
.agree-wrap.checked{background:#DCFCE7;border-color:#4ADE80}
.agree-check{width:22px;height:22px;border:2px solid #D1D5DB;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;background:white}
.agree-check.checked{background:#16A34A;border-color:#16A34A}
.scroll-hint{font-size:11px;color:#94A3B8;margin-bottom:8px;display:flex;align-items:center;gap:4px}
</style>
</head>

let state={phase:"policy",agreed:false,scrolled:false,sec:0,answers:{},name:"",dept:"",age:"",gender:"",email:"",sendStatus:"idle"};

function getRisk(s){return RISKS.find(r=>s<=r.max)||RISKS[3];}
function secScore(sid){
  const s=SECTIONS.find(x=>x.id===sid);
  const keys=Object.keys(state.answers).filter(k=>k.startsWith(sid+"_"));
  if(!keys.length)return 0;
  const avg=keys.reduce((a,k)=>a+state.answers[k],0)/keys.length;
  return s.rev?Math.round(((5-avg)/3)*100):Math.round(((avg-1)/3)*100);
}
function totalScore(){
  const w=[.25,.15,.15,.30,.15];
  return Math.round(SECTIONS.reduce((a,s,i)=>a+secScore(s.id)*w[i],0));
}
function toDay(){return new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});}

// ── メール送信（EmailJS）────────────────────────────────────
async function sendEmail(){
  const emailInput=document.getElementById("result-email");
  if(emailInput) state.email=emailInput.value;
  const nameInput=document.getElementById("result-name");
  if(nameInput && nameInput.value) state.name=nameInput.value;
  if(!state.email){alert("メールアドレスを入力してください。");return;}
  if(!CONFIGURED){
    alert("GASのURLがまだ設定されていません。");return;
  }

  state.sendStatus="sending"; render();

  try{
    const scores=SECTIONS.map(s=>secScore(s.id));
    const ts=totalScore();
    const risk=getRisk(ts);

    const sectionText=SECTIONS.map((s,i)=>{
      const sc=scores[i];
      const lvl=sc>=70?"high":sc>=40?"mid":"low";
      return `【${s.title}】${sc}点（${lvl==="high"?"要注意":lvl==="mid"?"やや高め":"良好"}）\n${COMMENTS[s.id][lvl]}`;
    }).join("\n\n");

    // Google Apps Script に送信
    // 全質問の回答を収集
    const allAnswers = {};
    SECTIONS.forEach(s=>{
      s.qs.forEach((q,qi)=>{
        const key = s.id+"_"+qi;
        allAnswers[key] = {
          section: s.title,
          question: q,
          answer: state.answers[key]||0,
          answer_label: OPTIONS[( state.answers[key]||1)-1]
        };
      });
    });

    // no-corsモードでは応答確認不可のため、fetch完了で成功とみなす
    await fetch(GAS_URL, {
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({
        name:        state.name||"",
        dept:        state.dept||"",
        age:         state.age||"",
        gender:      state.gender||"",
        email:       state.email,
        date:        toDay(),
        total_score: ts,
        risk_label:  risk.label,
        risk_desc:   risk.desc,
        section_text:sectionText,
        score_A:     scores[0],
        score_B:     scores[1],
        score_C:     scores[2],
        score_D:     scores[3],
        score_E:     scores[4],
        answers:     allAnswers,
      })
    }).catch(()=>{}); // no-corsエラーは無視

    // PDFを自動印刷・ダウンロード
    buildPDF();
    state.sendStatus="sent"; render();
  }catch(e){
    console.error(e);
    state.sendError=e.message||String(e);
    state.sendStatus="error"; render();
  }
}

        <span style="font-weight:800;color:${s.color}">${scores[i]}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${scores[i]}%;background:${s.color}"></div></div>
    </div>`).join("")}
  </div>
  <p style="font-size:15px;font-weight:800;color:#0F172A;margin-bottom:12px">領域別コメント</p>
  ${SECTIONS.map((s,i)=>{
    const sc=scores[i];
    const lvl=sc>=70?"high":sc>=40?"mid":"low";
    const tagBg=lvl==="high"?"#FEE2E2":lvl==="mid"?"#FEF3C7":"#DCFCE7";
    const tagCol=lvl==="high"?"#DC2626":lvl==="mid"?"#D97706":"#16A34A";
    return `<div class="detail-row" style="border-color:${s.color}">
      <div class="detail-top">
        <span>${ICONS[s.id]}</span>
        <span style="font-size:13px;font-weight:700;color:#1E293B;flex:1">${s.title}</span>
        <span style="font-size:15px;font-weight:900;color:${s.color}">${sc}点</span>
        <span class="detail-tag" style="background:${tagBg};color:${tagCol}">${lvl==="high"?"要注意":lvl==="mid"?"やや高め":"良好"}</span>
      </div>
      <p class="detail-comment">${COMMENTS[s.id][lvl]}</p>
    </div>`;
  }).join("")}
  ${emailPanel}
  <div class="btn-row no-print">
    <button class="btn-print" onclick="buildPDF()">📥 PDFをダウンロード</button>
    <button class="btn-retry" id="btn-retry">↩ 最初からやり直す</button>
  </div>
  <p class="disclaimer">※本スクリーニングは医療診断ではありません。高リスクの場合は産業医・専門家へのご相談をお勧めします。<br>※NIOSH職業性ストレス簡易調査票参考・キャリアコンサルタント向けスクリーニングツール</p>`;}

function bindEvents(){
  // Policy
  const agreeWrap=document.getElementById("agree-wrap");
  if(agreeWrap) agreeWrap.onclick=()=>{state.agreed=!state.agreed;render();};
  const btnStartPolicy=document.getElementById("btn-start-policy");
  if(btnStartPolicy) btnStartPolicy.onclick=()=>{if(state.agreed){state.phase="intro";render();}};

  const btnStart=document.getElementById("btn-start");
  if(btnStart) btnStart.onclick=()=>{
    state.name=document.getElementById("i-name").value;
    state.dept=document.getElementById("i-dept").value;
    state.email=document.getElementById("i-email").value;
    state.phase="quiz";render();
  };
  document.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{
    // テキスト入力の値を保存してから再描画
    const n=document.getElementById("i-name"); if(n) state.name=n.value;
    const d=document.getElementById("i-dept"); if(d) state.dept=d.value;
    const e=document.getElementById("i-email"); if(e) state.email=e.value;
    state.age=state.age===b.dataset.age?"":b.dataset.age;render();
  });
  document.querySelectorAll("[data-gender]").forEach(b=>b.onclick=()=>{
    // テキスト入力の値を保存してから再描画
    const n=document.getElementById("i-name"); if(n) state.name=n.value;
    const d=document.getElementById("i-dept"); if(d) state.dept=d.value;
    const e=document.getElementById("i-email"); if(e) state.email=e.value;
    state.gender=state.gender===b.dataset.gender?"":b.dataset.gender;render();
  });
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    state.answers[b.dataset.q]=parseInt(b.dataset.v);render();
  });
  const btnBack=document.getElementById("btn-back");
  if(btnBack) btnBack.onclick=()=>{if(state.sec>0){state.sec--;render();}};
  const btnNext=document.getElementById("btn-next");
  if(btnNext) btnNext.onclick=()=>{
    if(state.sec<SECTIONS.length-1){state.sec++;render();}
    else{state.phase="result";render();}
  };
  const btnSend=document.getElementById("btn-send");
  if(btnSend) btnSend.onclick=sendEmail;
  const btnRetry=document.getElementById("btn-retry");
  if(btnRetry) btnRetry.onclick=()=>{
    state={phase:"policy",agreed:false,scrolled:false,sec:0,answers:{},name:"",dept:"",age:"",gender:"",email:"",sendStatus:"idle"};
    render();
  };
}

render();
</script>
</body>
</html>
