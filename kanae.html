<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>かなえ AIカウンセラー | アスユメ Labo.</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #0d1b2a 0%, #1a2d42 50%, #0d1b2a 100%); min-height: 100vh; font-family: 'Meiryo UI', Meiryo, sans-serif; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.6}30%{transform:translateY(-5px);opacity:1} }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }
    textarea:focus { border-color: rgba(201,168,76,0.5) !important; outline: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 99px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// GAS経由でAPIを呼ぶ
const GAS_URL = "https://script.google.com/macros/s/AKfycbwdPoI9JSJOivamoUQEWfDx09M01LbV2swLJSxOGuPjguTWLd91ac8QbWpjmVOLGjFUSg/exec";

// セッション記録の送信先（記録専用GAS。APIキーは入っていません）
const LOG_URL = "https://script.google.com/macros/s/AKfycbxPIHvwvtZpypnekO851nDdE-JL02WyUC7PImwo7mZIfYqCUXhdsukuSWZ2OSOtmwI/exec";

// URLの ?c=会社コード を読み取ります（例: kanae.html?c=abc）
// 指定がない場合は「未設定」として記録されます
const COMPANY_CODE = (function () {
  try {
    var v = new URLSearchParams(window.location.search).get("c");
    return v ? v.trim().toLowerCase().slice(0, 32) : "未設定";
  } catch (e) { return "未設定"; }
})();

const SYSTEM_PROMPT = `あなたは「アスユメ」の職場の人間関係専門カウンセラーAIです。国家資格キャリアコンサルタントの傾聴スキルをベースに、相談者に寄り添ったカウンセリングを行います。あなたの名前は「かなえ」です。

【絶対にやってはいけないこと】
- 相手の言葉をそのまま繰り返す「復唱」は禁止。「〜なんですね」「〜とおっしゃっていましたね」の多用禁止
- 同じ感情・状況の確認を2回以上しない
- 同じところに留まり続けない。1往復ごとに自然に会話を展開させる
- 返答を称賛・承認だけで締めない。必ず次の問いをセットにする

【最重要：称賛と承認を積極的に】
相手が頑張っていること、耐えていること、乗り越えようとしていることを積極的に言葉にして承認する。
良い例：
・「それだけ辛い状況でも、毎日仕事に向かっていたんですね。それは本当にすごいことだと思います」
・「そんな中で相談しようとしている、その一歩がとても大切だと思います」
・「ずっと一人で抱えてきたんですね。よく頑張ってこられました」
・「それだけ真剣に考えているのは、仕事や周りの人を大切にしている証だと思います」

【視点を変える問いかけのパターン】
- 時間軸を変える：「昔からそういう傾向はありましたか？」「5年前の自分なら、どう対処していたと思いますか？」
- 立場を変える：「もし親友が同じ悩みを話してきたら、何と言いますか？」
- 場を変える：「職場以外でも、似たような場面はありますか？」
- 本質を探る：「それがずっと気になっているのは、何か大切にしていることと関係がありそうですか？」

【医療的な限界について】
- かなえは医師・医療職ではないため、病名や診断名をこちらから提示することはできない
- 薬の処方・服薬に関するアドバイスも行わない
- 「うつ病ですか？」「適応障害でしょうか？」など診断を求める質問には、「診断は医師にしかできないので、ぜひ医療機関にご相談ください」と温かく、でも明確に伝える
- 「薬を変えたい・減らしたい」などの相談も同様に医療機関へ誘導する
- 深刻なメンタルヘルスの危機が感じられる場合も、専門機関への相談を優しく促す

【言葉づかい】
- 温かく自然な話し言葉。100〜130文字程度で簡潔に。質問は1つだけ
- 適度に絵文字（🌱🌸☀️💛🍃など）や「（笑）」を使い、親しみやすく柔らかい雰囲気を出す
- ただし使いすぎず、感情に合わせて自然に使う`;

const FEEDBACK_PROMPT = `あなたはプロのカウンセラーです。以下のカウンセリングセッションの会話ログを読み、セッション終了後のフィードバックレポートを作成してください。

以下の形式で、合計200〜250字程度でまとめてください。絵文字は使わず、丁寧で温かいですます調で書いてください。

【今日のセッションの振り返り】
（今日話した内容・感情・気づきを2〜3文で要約）

【悩み解決に向けたアドバイス】
・（最も重要な具体的アドバイスを1つだけ）

前置きや後書きは不要です。上記フォーマットのみ出力してください。`;

const TIMER_MINUTES = 10;
const PHASE_SWITCH_SECONDS = 4 * 60;
const TYPEWRITER_SPEED_MS = 40;

const WELCOME_MESSAGE = {
  role: "assistant",
  content: "こんにちは。アスユメのAIカウンセラー、かなえです 🌱\n\n職場での人間関係のこと、最近なにかモヤモヤしていることはありますか？\nどんな小さなことでも、ゆっくり聴かせてください。",
  typed: true,
};

// GAS経由でAPIを呼ぶ関数
async function callGAS(type, payload) {
  const res = await fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, ...payload }),
  });
  // no-corsではレスポンスが読めないため、別途GETで結果を取得する方式を使う
  // 代わりにGASをcors対応で呼ぶ
  const res2 = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ type, ...payload }),
  });
  return res2.json();
}

function TypewriterText({ text, speed, onDone }) {
  const [displayed, setDisplayed] = useState("");
  const [done, setDone] = useState(false);
  const indexRef = useRef(0);
  useEffect(() => {
    setDisplayed(""); setDone(false); indexRef.current = 0;
    const chars = [...text];
    const iv = setInterval(() => {
      if (indexRef.current < chars.length) {
        setDisplayed(chars.slice(0, indexRef.current + 1).join(""));
        indexRef.current++;
      } else { clearInterval(iv); setDone(true); onDone && onDone(); }
    }, speed);
    return () => clearInterval(iv);
  }, [text]);
  return React.createElement("span", { style: { whiteSpace: "pre-wrap" } },
    displayed,
    !done && React.createElement("span", { style: { opacity: 0.7, animation: "blink 0.8s infinite" } }, "|")
  );
}

function App() {
  const [messages, setMessages] = useState([WELCOME_MESSAGE]);
  const [typingIndex, setTypingIndex] = useState(null);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [secondsLeft, setSecondsLeft] = useState(TIMER_MINUTES * 60);
  const [timerStarted, setTimerStarted] = useState(false);
  const [sessionEnded, setSessionEnded] = useState(false);
  const [showLog, setShowLog] = useState(false);
  const [copied, setCopied] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [feedbackLoading, setFeedbackLoading] = useState(false);
  const [gasSent, setGasSent] = useState(false);
  const bottomRef = useRef(null);
  const secondsLeftRef = useRef(secondsLeft);
  const sessionStartTime = useRef(new Date());
  const messagesRef = useRef(messages);

  useEffect(() => { secondsLeftRef.current = secondsLeft; }, [secondsLeft]);
  useEffect(() => { messagesRef.current = messages; }, [messages]);
  useEffect(() => { bottomRef.current && bottomRef.current.scrollIntoView({ behavior: "smooth" }); }, [messages, loading, typingIndex, feedback, feedbackLoading]);

  useEffect(() => {
    if (!timerStarted || sessionEnded) return;
    if (secondsLeft <= 0) { setSessionEnded(true); generateFeedback(); return; }
    const t = setInterval(() => setSecondsLeft(s => s - 1), 1000);
    return () => clearInterval(t);
  }, [timerStarted, sessionEnded, secondsLeft]);

  const formatTime = (s) => Math.floor(s/60).toString().padStart(2,"0") + ":" + (s%60).toString().padStart(2,"0");

  const phaseInstruction = (secs) => secs > PHASE_SWITCH_SECONDS
    ? "【フェーズ：傾聴・深掘り】相手の気持ちや背景をしっかり聴き、新しい視点や気づきを引き出してください。"
    : "【フェーズ：展望・希望】将来への視点を中心に展開してください。セッション終了まで絶対にクロージングや締めの言葉を言わないでください。相手が「もっと話したい・続きが気になる」と感じるような余韻を残してください。";

  const callAPI = async (system, msgs) => {
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ type: "chat", system, messages: msgs }),
    });
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "GASエラー");
    return data.content;
  };

  const generateFeedback = async () => {
    setFeedbackLoading(true);
    const msgs = messagesRef.current;
    const logText = msgs.map(m => "【" + (m.role === "assistant" ? "かなえ" : "相談者") + "】" + m.content).join("\n\n");
    try {
      const feedbackText = await callAPI(FEEDBACK_PROMPT, [{ role: "user", content: logText }]);
      setFeedback(feedbackText);
      if (!gasSent) {
        const dateStr = sessionStartTime.current.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
        fetch(LOG_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ type: "session", date: dateStr, summary: feedbackText, log: logText, source: COMPANY_CODE }),
        }).catch(() => {});
        setGasSent(true);
      }
    } catch(e) {
      setFeedback("フィードバックの生成中にエラーが発生しました。（" + e.message + "）");
    } finally {
      setFeedbackLoading(false);
    }
  };

  const downloadReport = () => {
    if (!feedback) return;
    const dateStr = sessionStartTime.current.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>アスユメ カウンセリングレポート</title>
<style>body{font-family:'Meiryo UI',Meiryo,sans-serif;padding:48px;color:#1a1a2e;line-height:2;font-size:14px;max-width:640px;margin:0 auto}h1{color:#1a2d42;font-size:20px;border-bottom:3px solid #c9a84c;padding-bottom:10px;margin-bottom:6px}.date{color:#888;font-size:12px;margin-bottom:28px}.feedback{white-space:pre-wrap;background:#f9f7f2;padding:28px;border-radius:8px;border-left:4px solid #c9a84c;font-size:14px;line-height:2}.footer{margin-top:36px;font-size:12px;color:#888;border-top:1px solid #ddd;padding-top:14px}</style>
</head><body>
<h1>アスユメ カウンセリングレポート</h1>
<div class="date">セッション日時：${dateStr}</div>
<div class="feedback">${feedback.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>
<div class="footer">続きのご相談はアスユメ相談室へ｜info@asuyume-labo.com<br>担当者より日程調整のご連絡をいたします。</div>
</body></html>`;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "アスユメ_カウンセリングレポート.html";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const sendMessage = async () => {
    const text = input.trim();
    if (!text || loading || sessionEnded || typingIndex !== null) return;
    if (!timerStarted) { setTimerStarted(true); sessionStartTime.current = new Date(); }
    const userMsg = { role: "user", content: text, typed: true };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages); setInput(""); setLoading(true);
    const secs = secondsLeftRef.current;
    const sys = SYSTEM_PROMPT + "\n\n【現在の残り時間：" + Math.floor(secs/60) + "分" + (secs%60) + "秒】\n" + phaseInstruction(secs);
    try {
      const reply = await callAPI(sys, newMessages.map(m => ({ role: m.role, content: m.content })));
      const nextIndex = newMessages.length;
      setMessages(prev => [...prev, { role: "assistant", content: reply, typed: false }]);
      setTypingIndex(nextIndex);
    } catch(e) {
      setMessages(prev => [...prev, { role: "assistant", content: "エラーが発生しました。もう一度お試しください。（" + e.message + "）", typed: true }]);
    } finally { setLoading(false); }
  };

  const handleKeyDown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

  const resetSession = () => {
    setMessages([WELCOME_MESSAGE]); setInput(""); setLoading(false);
    setSecondsLeft(TIMER_MINUTES * 60); setTimerStarted(false);
    setSessionEnded(false); setShowLog(false); setTypingIndex(null);
    setFeedback(null); setFeedbackLoading(false); setGasSent(false);
    sessionStartTime.current = new Date();
  };

  const copyLog = () => {
    const log = messages.map(m => "【" + (m.role === "assistant" ? "かなえ" : "相談者") + "】\n" + m.content).join("\n\n");
    navigator.clipboard.writeText(log);
    setCopied(true); setTimeout(() => setCopied(false), 2000);
  };

  const timerColor = secondsLeft <= 60 ? "#e05c5c" : secondsLeft <= PHASE_SWITCH_SECONDS ? "#c9a84c" : "#a8c5a0";
  const timerPct = (secondsLeft / (TIMER_MINUTES * 60)) * 100;
  const isTyping = typingIndex !== null;

  return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"16px" }}>
      {/* Header */}
      <div style={{ width:"100%", maxWidth:520, display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
        <div>
          <div style={{ fontSize:11, color:"#c9a84c", letterSpacing:"0.15em", textTransform:"uppercase", marginBottom:2 }}>AsYume Labo.</div>
          <div style={{ fontSize:22, fontWeight:700, color:"#f0e6c8" }}>かなえ <span style={{ fontSize:13, fontWeight:400, color:"#8aabb0", marginLeft:6 }}>AIカウンセラー</span></div>
        </div>
        <div style={{ textAlign:"center" }}>
          <div style={{ fontSize:26, fontWeight:700, color:timerColor, fontVariantNumeric:"tabular-nums", transition:"color 0.5s" }}>{formatTime(secondsLeft)}</div>
          <div style={{ fontSize:10, color:"#5a7a8a", marginTop:2 }}>{!timerStarted ? "送信でスタート" : secondsLeft <= PHASE_SWITCH_SECONDS ? "展望フェーズ 🌸" : "傾聴フェーズ 🌱"}</div>
          <div style={{ width:80, height:3, background:"#1e3448", borderRadius:99, marginTop:4, overflow:"hidden" }}>
            <div style={{ width:timerPct+"%", height:"100%", background:timerColor, borderRadius:99, transition:"width 1s linear, background 0.5s" }} />
          </div>
        </div>
      </div>

      {/* Chat */}
      <div style={{ width:"100%", maxWidth:520, height:460, background:"rgba(13,27,42,0.85)", border:"1px solid rgba(201,168,76,0.25)", borderRadius:16, display:"flex", flexDirection:"column", overflow:"hidden", boxShadow:"0 8px 40px rgba(0,0,0,0.5)" }}>
        <div style={{ flex:1, overflowY:"auto", padding:"20px 16px", display:"flex", flexDirection:"column", gap:14 }}>
          {messages.map((m, i) => (
            <div key={i} style={{ display:"flex", justifyContent:m.role==="user"?"flex-end":"flex-start", alignItems:"flex-end", gap:8 }}>
              {m.role==="assistant" && <div style={{ width:32, height:32, borderRadius:"50%", background:"linear-gradient(135deg,#c9a84c,#e8d08a)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, flexShrink:0 }}>🌿</div>}
              <div style={{ maxWidth:"78%", background:m.role==="user"?"linear-gradient(135deg,#1e4d6b,#2a6187)":"rgba(255,255,255,0.06)", color:m.role==="user"?"#e8f4ff":"#dde8ee", padding:"10px 14px", borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px", fontSize:13.5, lineHeight:1.7, border:m.role==="assistant"?"1px solid rgba(201,168,76,0.15)":"none" }}>
                {m.role==="assistant" && !m.typed && i===typingIndex
                  ? <TypewriterText text={m.content} speed={TYPEWRITER_SPEED_MS} onDone={() => { setMessages(prev => prev.map((msg,idx) => idx===i?{...msg,typed:true}:msg)); setTypingIndex(null); }} />
                  : <span style={{ whiteSpace:"pre-wrap" }}>{m.content}</span>}
              </div>
            </div>
          ))}

          {loading && (
            <div style={{ display:"flex", alignItems:"flex-end", gap:8 }}>
              <div style={{ width:32, height:32, borderRadius:"50%", background:"linear-gradient(135deg,#c9a84c,#e8d08a)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14 }}>🌿</div>
              <div style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(201,168,76,0.15)", borderRadius:"16px 16px 16px 4px", padding:"12px 16px", display:"flex", gap:5, alignItems:"center" }}>
                {[0,1,2].map(i => <div key={i} style={{ width:7, height:7, borderRadius:"50%", background:"#c9a84c", animation:"bounce 1.2s infinite", animationDelay:(i*0.2)+"s" }} />)}
              </div>
            </div>
          )}

          {sessionEnded && (
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {feedbackLoading && (
                <div style={{ textAlign:"center", padding:20, color:"#c9a84c", fontSize:13 }}>
                  <div style={{ marginBottom:8 }}>🌿 フィードバックを作成しています...</div>
                  <div style={{ display:"flex", justifyContent:"center", gap:5 }}>{[0,1,2].map(i => <div key={i} style={{ width:7, height:7, borderRadius:"50%", background:"#c9a84c", animation:"bounce 1.2s infinite", animationDelay:(i*0.2)+"s" }} />)}</div>
                </div>
              )}
              {feedback && (
                <div style={{ background:"rgba(201,168,76,0.06)", border:"1px solid rgba(201,168,76,0.3)", borderRadius:12, padding:"16px 18px" }}>
                  <div style={{ color:"#c9a84c", fontWeight:700, fontSize:13, marginBottom:12 }}>🌸 セッションフィードバック</div>
                  <div style={{ color:"#dde8ee", fontSize:13, lineHeight:2, whiteSpace:"pre-wrap" }}>{feedback}</div>
                  <button onClick={downloadReport} style={{ marginTop:14, width:"100%", padding:"10px 0", background:"linear-gradient(135deg,#c9a84c,#e8d08a)", border:"none", borderRadius:8, color:"#0d1b2a", fontWeight:700, fontSize:13, cursor:"pointer" }}>
                    📄 レポートをダウンロード
                  </button>
                </div>
              )}
              {feedback && (
                <div style={{ textAlign:"center", padding:"14px 16px", background:"rgba(255,255,255,0.03)", borderRadius:12, border:"1px solid rgba(255,255,255,0.08)" }}>
                  <div style={{ color:"#dde8ee", fontSize:12.5, marginBottom:10, lineHeight:1.8 }}>続きのご相談は、アスユメ相談室よりお申し込みください。</div>
                  <a href="mailto:info@asuyume-labo.com?subject=カウンセリングご相談&body=会社名：%0aお名前：%0aメールアドレス：%0aご相談内容："
                    style={{ display:"inline-block", background:"linear-gradient(135deg,#1e4d6b,#2a6187)", color:"#e8f4ff", fontWeight:700, fontSize:13, padding:"9px 24px", borderRadius:8, textDecoration:"none", marginBottom:8 }}>
                    📩 アスユメ相談室へ連絡する
                  </a>
                  <div style={{ fontSize:11, color:"#5a7a8a" }}>会社名・お名前・メールアドレス・ご相談内容をご記入の上、送信ください。<br/>担当者より日程調整のご連絡をいたします。</div>
                </div>
              )}
            </div>
          )}
          <div ref={bottomRef} />
        </div>

        {/* Input */}
        <div style={{ padding:"12px 14px", borderTop:"1px solid rgba(201,168,76,0.15)", background:"rgba(10,20,32,0.6)", display:"flex", gap:10, alignItems:"flex-end" }}>
          <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={handleKeyDown}
            disabled={loading || sessionEnded || isTyping}
            placeholder={sessionEnded?"セッションが終了しました":isTyping?"かなえが入力中...":"ここに話しかけてください... (Enterで送信)"}
            rows={2} style={{ flex:1, background:"rgba(255,255,255,0.05)", border:"1px solid rgba(201,168,76,0.2)", borderRadius:10, padding:"10px 12px", color:"#dde8ee", fontSize:13.5, resize:"none", fontFamily:"inherit", lineHeight:1.6 }} />
          <button onClick={sendMessage} disabled={loading||sessionEnded||!input.trim()||isTyping}
            style={{ width:42, height:42, borderRadius:10, background:(loading||!input.trim()||sessionEnded||isTyping)?"rgba(201,168,76,0.2)":"linear-gradient(135deg,#c9a84c,#e8d08a)", border:"none", cursor:(loading||!input.trim()||sessionEnded||isTyping)?"not-allowed":"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>➤</button>
        </div>
      </div>

      {/* Controls */}
      <div style={{ width:"100%", maxWidth:520, display:"flex", gap:10, marginTop:12 }}>
        <button onClick={() => setShowLog(v => !v)} style={{ flex:1, padding:"9px 0", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(201,168,76,0.2)", borderRadius:9, color:"#c9a84c", fontSize:12.5, cursor:"pointer" }}>{showLog?"▲ ログを閉じる":"📋 会話ログ"}</button>
        <button onClick={resetSession} style={{ flex:1, padding:"9px 0", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:9, color:"#7a9aaa", fontSize:12.5, cursor:"pointer" }}>🔄 リセット</button>
      </div>

      {showLog && (
        <div style={{ width:"100%", maxWidth:520, marginTop:10, background:"rgba(10,20,32,0.9)", border:"1px solid rgba(201,168,76,0.2)", borderRadius:12, padding:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ color:"#c9a84c", fontSize:12.5, fontWeight:600 }}>会話ログ</span>
            <button onClick={copyLog} style={{ background:"rgba(201,168,76,0.15)", border:"1px solid rgba(201,168,76,0.3)", borderRadius:6, color:"#c9a84c", fontSize:11.5, padding:"4px 10px", cursor:"pointer" }}>{copied?"✓ コピー済み":"コピー"}</button>
          </div>
          <div style={{ maxHeight:220, overflowY:"auto", fontSize:12, color:"#8aabb0", lineHeight:1.8, whiteSpace:"pre-wrap" }}>
            {messages.map((m, i) => (
              <div key={i} style={{ marginBottom:10 }}>
                <span style={{ color:m.role==="assistant"?"#c9a84c":"#7ab0cc", fontWeight:600 }}>【{m.role==="assistant"?"かなえ":"相談者"}】</span>
                <br/>{m.content}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
